name: Sync Upstream

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/LmeSzinc/AzurLaneAutoScript.git
          git fetch upstream

      - name: Sync with upstream
        run: |
          git checkout master
          git merge --no-ff upstream/master --allow-unrelated-histories -m "Merge upstream/master"
          
      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git push origin master

      - name: Sync master to kdev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout kdev
          git merge --no-ff master -m "Sync master to kdev"
          git push origin kdev

      - name: Send failure notification
        if: failure()
        run: |
          curl -s "https://api.day.app/N7xUCURtR3EWhsotV8oAUD/AzurLaneAutoScript%20%E5%90%8C%E6%AD%A5%E5%A4%B1%E8%B4%A5" || true